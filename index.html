<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>振り向いてくれ俺の</title>
    <link rel="icon" type="image/png" href="./images/umiusa_fabicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>振り向いてくれ俺の</h1>

        <div class="mode-row" aria-label="パズルサイズ">
            <button class="mode-button" type="button" data-size="2">2x2</button>
            <button class="mode-button" type="button" data-size="3">3x3</button>
            <button class="mode-button active" type="button" data-size="4">4x4</button>
        </div>
        
        <div class="info">
            <div class="message-area">
                <div id="message"></div>
                <div id="shareBox" class="share-box hidden">
                    <a id="shareLink" href="#" target="_blank" rel="noopener noreferrer">𝕏で結果を共有</a>
                </div>
            </div>
            <div class="score-box">
                <div id="movesDisplay">
                    <span class="material-symbols-outlined" aria-hidden="true">timer</span>
                    <span id="movesCount">0</span>
                </div>
                <div id="timeDisplay" aria-label="タイム: 00:00">
                    <span class="material-symbols-outlined" aria-hidden="true">hourglass</span>
                    <span id="timeCount">00:00</span>
                </div>
                <div id="bestScoreDisplay" aria-label="ベスト: -">
                    <span class="material-symbols-outlined" aria-hidden="true">crown</span>
                    <span id="bestScoreCount">-</span>
                </div>
                <div id="bestTimeDisplay" aria-label="ベストタイム: -">
                    <span class="material-symbols-outlined" aria-hidden="true">crown</span>
                    <span id="bestTimeCount">-</span>
                </div>
            </div>
        </div>

        <div class="puzzle-area">
            <div id="puzzleBoard">
                </div>
        </div>
        
        <div class="button-area">
            <div class="button-row">
                <button id="retryButton" type="button">リセット</button>
                <button id="newGameButton">新しく始める</button>
            </div>
        </div>

        <div class="setting-area">
            <div class="setting-row">
                <span class="toggle-label">パネル番号を表示</span>
                <label class="toggle-button-2" aria-label="数字表示">
                    <input id="numberToggleInput" type="checkbox"/>
                </label>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
